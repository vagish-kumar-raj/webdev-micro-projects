<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Basic Calculator</h1>
    </header>
    <hr />
    <main>
      <article>
        <h2 id="inputnum"></h2>
        <div id="l2">
          <h3 id="OPR"></h3>
          <h3 id="final"></h3>
        </div>
      </article>

      <br />
      <button id="AC" value="AC">AC</button>
      <button id="C" value="C">C</button>
      <button class="symb" id="perc" value="%">%</button>
      <button class="symb" id="div" value="/">÷</button>
      <br />
      <button id="seven" value="7">7</button>
      <button id="eight" value="8">8</button>
      <button id="nine" value="9">9</button>
      <button class="symb" id="multi" value="*">×</button>
      <br />
      <button id="four" value="4">4</button>
      <button id="five" value="5">5</button>
      <button id="six" value="6">6</button>
      <button class="symb" id="sub" value="-">-</button>
      <br />
      <button id="three" value="3">3</button>
      <button id="two" value="2">2</button>
      <button id="one" value="1">1</button>
      <button class="symb" id="addi" value="+">+</button>
      <br />
      <button id="zero" value="0">0</button>
      <button id="deci" value=".">.</button>
      <button id="eq" class="symb" value="=">=</button>
    </main>
    <script src="main.js"></script>
  </body>
</html>
