<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Basic Calculator</h1>
    </header>
    <hr />
    <main>
      <article>
        <h2 id="inputnum"></h2>
      </article>

      <br />
      <button id="AC">AC</button><button id="C">C</button><button class="symb" id="perc">%</button
      ><button class="symb" id="div">÷</button><br />
      <button id="seven">7</button><button id="eight">8</button><button id="nine">9</button><button class="symb" id="multi">×</button><br />
      <button id="four">4</button><button id="five">5</button><button id="six">6</button><button class="symb" id="sub">-</button><br />
      <button id="three">3</button><button id="two">2</button><button id="one">1</button><button class="symb" id="addi">+</button><br />
      <button id="zero">0</button><button id="deci">.</button><button id="eq" class="symb">=</button><br />
    </main>
    <script src="main.js"></script>
  </body>
</html>
