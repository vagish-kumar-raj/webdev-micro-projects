<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Tally Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="title">Tally Counter</h1>
    <h2 id="count">0</h2>
    <div class="buttons">
      <button id="add" class="btn" onclick="add()">+</button>
      <button id="sub" class="btn" onclick="sub()">-</button>
      <br />
      <button id="reset" class="btn" onclick="reset()">Reset</button>
      <button id="save" class="btn" onclick="saves()">Save</button>
      <button id="clhi" class="btn" onclick="clh()">Clear History</button>
    </div>
    <h2>
      <span id="hist">History: </span><br />
      <br /><span id="saves"></span>
    </h2>
    <script src="script.js"></script>
  </body>
</html>
